[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-jp"
version = "0.1.0"
description = "Personal Japanese-stock research and operation workspace"
requires-python = ">=3.11"
dependencies = [
  "certifi==2026.7.22",
  "openpyxl==3.1.5",
  "pypdf==6.16.1",
  "pdfplumber==0.11.8",
  "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = ["PyYAML>=6.0,<7"]

[project.scripts]
stock-jp = "stock_jp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stock_jp*"]

name: history-once-disabled
# One-time history proposal only; no existing blocked campaign may be imported.
# Future limits: 280 sessions, 600 requests, 50 batches of at most 12.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-private-market-writer
  cancel-in-progress: false
jobs:
  disabled-history-design:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/operations/private/
            !/stock.jp/data/jquants-archive/
            !/stock.jp/data/daily-prices/
      - name: Offline readiness report only
        run: python stock.jp/scripts/actions_readiness.py

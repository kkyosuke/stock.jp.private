name: history-once-disabled
# One-time history proposal only; no existing blocked campaign may be imported.
# Future limits: 280 sessions, 600 requests, 50 batches of at most 12.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-private-market-writer
  cancel-in-progress: false
jobs:
  disabled-history-design:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Disabled pending separate implementation and execution authorization
        run: echo 'STOP_DISABLED; history adapter and approval gates not connected'

name: Manual date acquisition with main reservation
# Manual entry only. Runtime approval, retirement and ledger gates remain mandatory.
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date (YYYY-MM-DD); actual retrieval occurs at execution time'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: stock-private-market-writer
  cancel-in-progress: false
jobs:
  reviewed-execution:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'kkyosuke/stock.jp.private' && github.ref == 'refs/heads/main' && github.actor == 'kkyosuke' && github.triggering_actor == 'kkyosuke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/operations/private/
            !/stock.jp/data/jquants-archive/
            !/stock.jp/data/daily-prices/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install reviewed runtime dependencies
        run: >-
          python -m pip install "xlrd==2.0.2" "openpyxl==3.1.5"
          "pypdf==6.16.1" "pdfplumber==0.11.8" "certifi==2026.7.22" PyYAML
      - name: Prepare reservation or execute the approved attempt
        env:
          STOCK_TARGET_DATE: ${{ inputs.target_date }}
          AUTOMATION_PAT: ${{ secrets.AUTOMATION_PAT }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          STOCK_ACTIONS_ENABLED: ${{ vars.STOCK_ACTIONS_ENABLED }}
          STOCK_ACTIONS_APPROVAL_SHA256: ${{ vars.STOCK_ACTIONS_APPROVAL_SHA256 }}
        run: python stock.jp/scripts/actions_date_driver.py --target-date "$STOCK_TARGET_DATE" --root "$GITHUB_WORKSPACE"

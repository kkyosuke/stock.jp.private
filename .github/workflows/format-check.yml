name: format-check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: format-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check Markdown formatting
        run: npm run lint:markdown

      - name: Check shell syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 sh -n

      - name: Test operation automation
        run: python3 -m unittest discover -s tests -v

      - name: Test Cloudflare scheduler
        run: node --test cloudflare/operations-scheduler/worker.test.mjs

      - name: Check YAML syntax
        run: |
          ruby -e '
            require "yaml"
            paths = Dir[".github/workflows/*.{yml,yaml}"] +
              [".markdownlint-cli2.yaml", "lefthook.yml"]
            paths.sort.each do |path|
              YAML.parse_file(path)
              puts "validated: #{path}"
            end
          '

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install operation validation dependencies
        run: >-
          python -m pip install "xlrd==2.0.2" "openpyxl==3.1.5"
          "pypdf==6.16.1" "certifi==2026.7.22" PyYAML

      - name: Validate private operation state and PAPER readiness
        run: |
          bootstrap_output=$(mktemp)
          trap 'rm -f "$bootstrap_output"' EXIT HUP INT TERM
          ./scripts/setup-workspace.sh
          python stock.jp/scripts/operation_state.py validate
          python stock.jp/scripts/operation_bootstrap.py check >"$bootstrap_output"
          cat "$bootstrap_output"
          python - "$bootstrap_output" <<'PY'
          import json
          from pathlib import Path
          import sys

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if result.get("paper_go") is not True:
              raise SystemExit("PAPER readiness check failed")
          if result.get("broker_submission") != "HUMAN_ONLY":
              raise SystemExit("broker submission boundary changed from HUMAN_ONLY")
          PY
          git diff --exit-code -- operations/private

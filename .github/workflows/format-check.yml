name: format-check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: format-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve committed stock.jp gitlink
        id: stock-jp-pin
        shell: bash
        run: |
          sha=$(git rev-parse HEAD:stock.jp)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Owner approved the existing PAT for this checkout only. Its grants
      # are not inspected or changed; no write operation uses this credential.
      - name: Require approved stock.jp checkout credential
        shell: bash
        env:
          AUTOMATION_PAT: ${{ secrets.AUTOMATION_PAT }}
        run: |
          if [[ -z "$AUTOMATION_PAT" ]]; then
            echo '::error::AUTOMATION_PAT is not configured. Configure the approved existing secret in repository Actions settings.'
            exit 1
          fi

      - name: Check out pinned private stock.jp
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: kkyosuke/stock.jp
          ref: ${{ steps.stock-jp-pin.outputs.sha }}
          path: stock.jp
          token: ${{ secrets.AUTOMATION_PAT }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/jquants-archive/

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check Markdown formatting
        run: npm run lint:markdown

      - name: Check shell syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 sh -n

      - name: Test operation guardrails
        run: python3 -m unittest discover -s tests -v

      - name: Test Cloudflare scheduler
        run: node --test cloudflare/operations-scheduler/worker.test.mjs

      - name: Check YAML syntax
        run: |
          ruby -e '
            require "yaml"
            paths = Dir[".github/workflows/*.{yml,yaml}"] +
              [".markdownlint-cli2.yaml", "lefthook.yml"]
            paths.sort.each do |path|
              YAML.parse_file(path)
              puts "validated: #{path}"
            end
          '

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install operation validation dependencies
        run: >-
          python -m pip install "xlrd==2.0.2" "openpyxl==3.1.5"
          "pypdf==6.16.1" "certifi==2026.7.22" PyYAML

      - name: Validate checkout state and PAPER policy (no runtime data)
        run: |
          python scripts/validate_checkout.py
          git diff --exit-code -- operations/private
          test -z "$(git ls-files --others --exclude-standard -- operations/private)"

      - name: Test synthetic runtime integration (not real-data readiness)
        run: python stock.jp/scripts/operation_smoke.py --days 20 --start-date 2026-09-01

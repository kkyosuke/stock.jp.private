name: format-check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: format-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/stock.jp/data/jquants-archive/
            !/stock.jp/data/daily-prices/

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check Markdown formatting
        run: npm run lint:markdown

      - name: Check shell syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 sh -n

      - name: Test operation guardrails
        run: python3 -m unittest discover -s tests -v

      - name: Check YAML syntax
        run: |
          ruby -e '
            require "yaml"
            paths = Dir[".github/workflows/*.{yml,yaml}"] +
              [".markdownlint-cli2.yaml", "lefthook.yml"]
            paths.sort.each do |path|
              YAML.parse_file(path)
              puts "validated: #{path}"
            end
          '

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install operation validation dependencies
        run: >-
          python -m pip install "xlrd==2.0.2" "openpyxl==3.1.5"
          "pypdf==6.16.1" "pdfplumber==0.11.8" "certifi==2026.7.22" PyYAML

      - name: Validate checkout state and PAPER policy (no runtime data)
        run: |
          python scripts/validate_checkout.py
          git diff --exit-code -- operations/private
          test -z "$(git ls-files --others --exclude-standard -- operations/private)"

      - name: Test synthetic runtime integration (not real-data readiness)
        run: python stock.jp/scripts/operation_smoke.py --days 20 --start-date 2026-09-01

name: update-public-submodule

# Compatibility endpoint: old external dispatches must never mutate repositories.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - stock.jp
      - .github/workflows/update-public-submodule.yml

permissions:
  contents: read

jobs:
  ownership-guardrail:
    runs-on: ubuntu-latest
    steps:
      - name: Explain assistant-owned synchronization
        run: |
          echo 'Public synchronization is assistant-owned; this workflow does not fetch data, change pointers, create PRs or merge.'
          echo 'Review docs/operations/assistant-daily-operation.md and run the normal PR validation.'

name: Nightly market data

on:
  schedule:
    - cron: '0 21 * * *'
      timezone: Asia/Tokyo
    - cron: '20 21 * * *'
      timezone: Asia/Tokyo
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date (YYYY-MM-DD); empty uses today in JST'
        required: false
        type: string
      preview:
        description: 'Verify a draft data PR and CI without adopting it to main'
        required: false
        default: false
        type: boolean
      financial_history:
        description: 'Collect five-year financial and earnings history into an isolated durable checkpoint'
        required: false
        default: false
        type: boolean
      paper_research:
        description: 'Prepare real PAPER research and collect primary sources without acquiring daily market data'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: stock-private-market-writer
  cancel-in-progress: false

jobs:
  nightly-market-data:
    if: ${{ !inputs.paper_research && github.repository == 'kkyosuke/stock.jp.private' && github.actor == 'kkyosuke' && github.triggering_actor == 'kkyosuke' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.preview)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/market/legacy-prices/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Collect, verify and save market data
        if: ${{ !inputs.financial_history }}
        env:
          STOCK_TARGET_DATE: ${{ inputs.target_date }}
          STOCK_PREVIEW: ${{ inputs.preview }}
          GITHUB_TOKEN: ${{ github.token }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          args=()
          if [ -n "$STOCK_TARGET_DATE" ]; then args+=(--target-date "$STOCK_TARGET_DATE"); fi
          if [ "$STOCK_PREVIEW" = "true" ]; then args+=(--preview); fi
          python -m stock_jp automation nightly "${args[@]}"
      - name: Collect financial and earnings history
        if: ${{ inputs.financial_history }}
        env:
          STOCK_TARGET_DATE: ${{ inputs.target_date }}
          GITHUB_TOKEN: ${{ github.token }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python -m stock_jp automation financial-history --as-of "$STOCK_TARGET_DATE"
      - name: Save execution summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-market-data-${{ github.run_id }}
          path: .work/nightly-market-data.json
          if-no-files-found: warn
          retention-days: 30
      - name: Save financial-history inputs and execution summary
        if: ${{ always() && inputs.financial_history }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: financial-history-${{ github.run_id }}
          path: |
            .work/financial-history.json
            .work/market-data/jquants/financial-history/
          if-no-files-found: warn
          retention-days: 30
  paper-research:
    needs: nightly-market-data
    if: ${{ always() && !cancelled() && !inputs.financial_history && github.repository == 'kkyosuke/stock.jp.private' && github.actor == 'kkyosuke' && github.triggering_actor == 'kkyosuke' && ((needs.nightly-market-data.result == 'success' && !inputs.preview) || (github.event_name == 'workflow_dispatch' && inputs.paper_research && (github.ref == 'refs/heads/main' || inputs.preview))) }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.paper_research && github.sha || 'main' }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/market/legacy-prices/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Restore adopted official data
        run: python -m stock_jp data restore
      - name: Restore durable query pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STOCK_PREVIEW: ${{ inputs.preview }}
        run: |
          args=()
          if [ "$STOCK_PREVIEW" = "true" ]; then args+=(--preview); fi
          python -m stock_jp.automation.paper_checkpoint restore "${args[@]}" --output .work/paper-research/restored.json
      - name: Preserve primary sources and the forward input receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STOCK_PREVIEW: ${{ inputs.preview }}
        run: python -m stock_jp.automation.provider_budget forward --output .work/paper-research/collection.json
      - name: Start real PAPER research and preserve its review queue
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          STOCK_PREVIEW: ${{ inputs.preview }}
        run: |
          args=()
          if [ "$STOCK_PREVIEW" = "true" ]; then args+=(--allow-before-publication); fi
          python -m stock_jp.automation.provider_budget prepare "${args[@]}" --resume-receipt .work/paper-research/restored.json --output .work/paper-research/preparation.json
      - name: Verify frozen rules and approvals were preserved
        id: frozen
        if: always()
        run: git diff --exit-code -- config docs/rules operations/evidence src
      - name: Save the unreviewed source inbox in private Git
        if: ${{ !cancelled() && steps.frozen.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STOCK_PREVIEW: ${{ inputs.preview }}
        run: |
          args=()
          if [ "$STOCK_PREVIEW" = "true" ]; then args+=(--preview); fi
          python -m stock_jp.automation.paper_checkpoint save "${args[@]}" --output .work/paper-research/checkpoint.json
      - name: Preserve the review inbox and licensed-source checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-research-${{ github.run_id }}
          path: |
            .work/paper-research/
            .work/market-data/nightly-source-cache/
            operations/runs/
            operations/state.json
            operations/run-history.csv
            research/historical-replay/v04-forward/
            data/market/primary-sources/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

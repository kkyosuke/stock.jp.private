name: deploy-operations-scheduler

# Retained as a validation-only compatibility endpoint; no deployment credentials.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - cloudflare/operations-scheduler/**
      - .github/workflows/deploy-operations-scheduler.yml

permissions:
  contents: read

jobs:
  validate-retired-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test inert scheduler
        run: node --test cloudflare/operations-scheduler/worker.test.mjs

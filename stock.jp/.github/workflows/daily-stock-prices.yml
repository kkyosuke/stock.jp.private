name: daily-stock-prices

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/daily-prices/**"
      - "data/jquants-archive/**"
      - "scripts/**"
      - "tests/**"
      - "operations/templates/source-config-template.json"
      - ".github/workflows/daily-stock-prices.yml"

concurrency:
  group: daily-stock-prices-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guardrail:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/jquants-archive/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: >-
          python -m pip install "xlrd==2.0.2" "openpyxl==3.1.5"
          "pypdf==6.16.1" "certifi==2026.7.22" PyYAML

      # Legacy public files are retained, but are not an authorized live feed.
      # Provider rights remain unresolved: use synthetic fixtures only here.
      - name: Validate synthetic archive guardrails
        run: python -m unittest tests.test_public_price_guardrail tests.test_market_data_storage -v

      - name: Run unit and integration guardrails
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q scripts tests
          python scripts/operation_smoke.py --days 20 --start-date 2026-09-01

      - name: Confirm tracked files were not changed
        run: git diff --exit-code
